<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Pacific Rim Gallery</title>

        <meta name="viewport" content="width=device-width, initial-scale=1">

        "https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    </head>
    <body>
        <div class="container text-center">

                 <div class="card-body text-center">
                  <h5 class="card-title" id="image-title">Image 1</h5>
                 </div> 
                </div>
              </div>
            </div>
            <!-- Declare the pagination class -->
             <ul class="pagination">

                <!-- Declare the item in the group -->
                 

                 <!-- Rest of the pagination items -->
                  <li class="page-item">
                    <a class="page-link" href="#" data-img="jeager.jpg" style="width: 100px; height: 100px;" data-title="Image 1">1</a>
                  </li>
                  <li class="page-item">
                    <a class="page-link" href="#" data-img="Gipsy Danger.jpg" style="width: 100px; height: 100px;" data-title="Image 2">2</a>
                  </li>
                  <li class="page-item">
                    <a class="page-link" href="#" data-img="Otachi.jpg" style="width: 100px; height: 100px;" data-title="Image 3">3</a>
                  </li>
                  <li class="page-item">
                    <a class="page-link" href="#" data-img="Tresspasser.jpg" style="width: 100px; height: 100px;" data-title="Image 4">4</a>
                  </li>
             </ul>
